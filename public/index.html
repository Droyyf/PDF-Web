<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Composer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- crossorigin makes the stylesheet response CORS-introspectable, so the service worker
         can cache it (and the font files it pulls) for full offline use -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@500&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header class="app-header">
        <h1 class="app-title">PDF COMPOSER</h1>
        <div class="header-controls">
            <span id="docCount" class="doc-count hidden"></span>
            <button id="addPdfBtn" class="btn hidden">+ Add PDFs</button>
            <select id="packagingSelect" class="format-select hidden" title="Export packaging">
                <option value="combined">Combined</option>
                <option value="perdoc">Per document</option>
                <option value="perpage">Per page</option>
            </select>
            <select id="exportFormat" class="format-select hidden" title="Export format">
                <option value="pdf">PDF</option>
                <option value="png">PNG</option>
                <option value="jpeg">JPEG</option>
            </select>
            <button id="exportBtn" class="btn btn-primary hidden" disabled>Export</button>
        </div>
    </header>

    <!-- Cockpit shell: persistent rail + main; only main's content swaps -->
    <div class="cockpit">

        <!-- Left rail: pinned All / combined row + per-doc rows. Hidden when no docs. -->
        <aside id="appRail" class="app-rail hidden" aria-label="Documents">
            <button id="railAllRow" class="rail-row rail-row--all active" data-tab="all" type="button">
                <span class="rail-thumb rail-thumb--all" aria-hidden="true">
                    <svg viewBox="0 0 56 70" fill="none" stroke="currentColor" stroke-width="1.6" preserveAspectRatio="xMidYMid meet">
                        <rect x="8"  y="10" width="34" height="44"/>
                        <rect x="13" y="15" width="34" height="44"/>
                        <rect x="18" y="20" width="34" height="44"/>
                    </svg>
                </span>
                <span class="rail-info">
                    <span class="rail-name">All / Combined</span>
                    <span id="railAllSummary" class="rail-summary">—</span>
                </span>
            </button>
            <div id="railDocs" class="rail-docs"></div>
        </aside>

        <!-- Main area: one of empty / overview / workspace is visible at a time -->
        <main class="app-main">

            <!-- Empty / upload state (shown when no docs loaded) -->
            <section id="emptyState" class="empty-state">
                <div class="upload-card" id="dropZone">
                    <div class="upload-card-header">
                        <span>PDF COMPOSER</span>
                        <span>×01</span>
                    </div>
                    <div class="upload-icon"></div>
                    <h2>Select PDFs<br>to begin</h2>
                    <p>Any size — processed entirely in your browser.</p>
                    <button id="chooseFileBtn" class="btn btn-primary">Choose PDFs</button>
                    <p class="upload-hint">…or drag &amp; drop files here</p>
                    <div class="upload-card-footer">
                        <span>P.01 / SRC</span>
                        <svg class="upload-globe" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="20" cy="20" r="17" stroke="currentColor" stroke-width="1.5"/>
                            <ellipse cx="20" cy="20" rx="9" ry="17" stroke="currentColor" stroke-width="1.5"/>
                            <ellipse cx="20" cy="20" rx="17" ry="6.5" stroke="currentColor" stroke-width="1.5"/>
                            <line x1="3" y1="20" x2="37" y2="20" stroke="currentColor" stroke-width="1.5"/>
                        </svg>
                        <span>‹ ‹ ‹</span>
                    </div>
                </div>
            </section>

            <!-- All / combined view: the combined preview alone (rail now absorbs the doc grid) -->
            <section id="overviewPanel" class="overview-panel hidden">
                <div id="combinedPreview" class="combined-preview-area"></div>
            </section>

            <!-- Per-doc workspace: thin pages strip + dominant preview -->
            <section id="workspace" class="workspace hidden">
                <aside class="pages-panel">
                    <div class="panel-header">
                        <h2 class="panel-title">PAGES <span class="muted">(<span id="pageCount">0</span>)</span></h2>
                        <div class="selection-summary">
                            <span class="sel-pill" title="Citation pages">○ <span id="citationCount">0</span></span>
                            <span class="sel-pill" title="Cover page">★ <span id="coverLabel">—</span></span>
                        </div>
                    </div>
                    <div id="pageList" class="page-list"></div>
                </aside>

                <section class="preview-panel">
                    <div class="preview-header">
                        <h2 class="panel-title">LIVE PREVIEW</h2>
                        <div class="mode-switch" id="modeSwitch">
                            <button class="mode-btn active" data-mode="sidebyside">Side&times;Side</button>
                            <button class="mode-btn" data-mode="top">Top</button>
                        </div>
                        <div class="preview-actions">
                            <label class="frame-label" title="Decorative frame">Frame
                                <select id="frameSelect" class="format-select"></select>
                            </label>
                            <button id="resetCoverBtn" class="btn hidden" title="Reset cover position">Reset cover</button>
                        </div>
                    </div>
                    <div id="previewList" class="preview-list">
                        <div id="previewEmpty" class="preview-empty">Select citation pages to preview.</div>
                    </div>
                </section>
            </section>
        </main>
    </div>

    <!-- Window-level drag-drop overlay (active once docs are loaded) -->
    <div id="dropOverlay" class="drop-overlay hidden" aria-hidden="true">
        <div class="drop-overlay-card">Drop PDFs anywhere</div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <input type="file" id="fileInput" accept="application/pdf,.pdf" multiple hidden>

    <!-- Third-party libraries (globals: pdfjsLib, PDFLib) — vendored locally so first load
         doesn't depend on a third-party CDN; the service worker then caches them for repeats. -->
    <script src="vendor/pdf.min.js"></script>
    <script src="vendor/pdf-lib.min.js"></script>
    <!-- App (ES modules) -->
    <script type="module" src="js/main.js"></script>
</body>

</html>
