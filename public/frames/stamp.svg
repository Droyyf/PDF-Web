<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- STAMP — perforated postage-stamp frame. sliceFrac 0.2 -> ring = 80px. Cream paper ring
       with punched perforation holes around the outer edge (via mask), ink rules inside.
       Window is transparent. -->
  <defs>
    <mask id="perf">
      <rect width="400" height="400" fill="white"/>
      <!-- perforation holes along all four outer edges (within the 80px ring) -->
      <g fill="black">
        <circle cx="0" cy="20" r="8"/><circle cx="0" cy="60" r="8"/><circle cx="0" cy="100" r="8"/><circle cx="0" cy="140" r="8"/><circle cx="0" cy="180" r="8"/><circle cx="0" cy="220" r="8"/><circle cx="0" cy="260" r="8"/><circle cx="0" cy="300" r="8"/><circle cx="0" cy="340" r="8"/><circle cx="0" cy="380" r="8"/>
        <circle cx="400" cy="20" r="8"/><circle cx="400" cy="60" r="8"/><circle cx="400" cy="100" r="8"/><circle cx="400" cy="140" r="8"/><circle cx="400" cy="180" r="8"/><circle cx="400" cy="220" r="8"/><circle cx="400" cy="260" r="8"/><circle cx="400" cy="300" r="8"/><circle cx="400" cy="340" r="8"/><circle cx="400" cy="380" r="8"/>
        <circle cx="20" cy="0" r="8"/><circle cx="60" cy="0" r="8"/><circle cx="100" cy="0" r="8"/><circle cx="140" cy="0" r="8"/><circle cx="180" cy="0" r="8"/><circle cx="220" cy="0" r="8"/><circle cx="260" cy="0" r="8"/><circle cx="300" cy="0" r="8"/><circle cx="340" cy="0" r="8"/><circle cx="380" cy="0" r="8"/>
        <circle cx="20" cy="400" r="8"/><circle cx="60" cy="400" r="8"/><circle cx="100" cy="400" r="8"/><circle cx="140" cy="400" r="8"/><circle cx="180" cy="400" r="8"/><circle cx="220" cy="400" r="8"/><circle cx="260" cy="400" r="8"/><circle cx="300" cy="400" r="8"/><circle cx="340" cy="400" r="8"/><circle cx="380" cy="400" r="8"/>
        <!-- corner holes -->
        <circle cx="0" cy="0" r="8"/><circle cx="400" cy="0" r="8"/><circle cx="0" cy="400" r="8"/><circle cx="400" cy="400" r="8"/>
      </g>
    </mask>
  </defs>
  <path fill="#f1ece2" fill-rule="evenodd" mask="url(#perf)"
        d="M0 0 H400 V400 H0 Z M80 80 H320 V320 H80 Z"/>
  <!-- Ink rules framing the window -->
  <rect x="88" y="88" width="224" height="224" fill="none" stroke="#35302b" stroke-width="4"/>
  <rect x="96" y="96" width="208" height="208" fill="none" stroke="#35302b" stroke-width="1.5"/>
  <!-- Corner postmarks (within the 80px corner slices) -->
  <g fill="none" stroke="#a83a4c" stroke-width="2.5">
    <circle cx="44" cy="44" r="16"/>
    <circle cx="356" cy="44" r="16"/>
    <circle cx="44" cy="356" r="16"/>
    <circle cx="356" cy="356" r="16"/>
  </g>
  <g fill="#a83a4c">
    <circle cx="44" cy="44" r="4"/><circle cx="356" cy="44" r="4"/>
    <circle cx="44" cy="356" r="4"/><circle cx="356" cy="356" r="4"/>
  </g>
</svg>
