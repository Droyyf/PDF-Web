<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- DECO — art-deco noir and gold. sliceFrac 0.2 -> ring = 80px. Noir ring, gold rules, and
       stepped corner fans (within the 80px corner slices). Window is transparent. -->
  <path fill="#14100e" fill-rule="evenodd"
        d="M0 0 H400 V400 H0 Z M80 80 H320 V320 H80 Z"/>
  <!-- Gold rules: outer, mid, inner -->
  <rect x="10" y="10" width="380" height="380" fill="none" stroke="#c9a24a" stroke-width="5"/>
  <rect x="24" y="24" width="352" height="352" fill="none" stroke="#e6c878" stroke-width="1.5"/>
  <rect x="72" y="72" width="256" height="256" fill="none" stroke="#c9a24a" stroke-width="4"/>
  <!-- Stepped corner fans (within the 80px corner slices) -->
  <g fill="none" stroke="#c9a24a" stroke-width="3">
    <path d="M80 80 H44 V44 H80 Z"/>
    <path d="M80 62 H62 V80 M80 44 H44 V80" />
    <path d="M320 80 H356 V44 H320 Z"/>
    <path d="M320 62 H338 V80 M320 44 H356 V80"/>
    <path d="M80 320 H44 V356 H80 Z"/>
    <path d="M80 338 H62 V320 M80 356 H44 V320"/>
    <path d="M320 320 H356 V356 H320 Z"/>
    <path d="M320 338 H338 V320 M320 356 H356 V320"/>
  </g>
  <g fill="#e6c878">
    <circle cx="62" cy="62" r="3.5"/><circle cx="338" cy="62" r="3.5"/>
    <circle cx="62" cy="338" r="3.5"/><circle cx="338" cy="338" r="3.5"/>
  </g>
</svg>
