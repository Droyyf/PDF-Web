<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- RULES — minimal scholarly double rule. sliceFrac 0.18 -> ring = 72px. Warm paper ring,
       ink + ochre rules along the window, small ochre diamonds in the corners.
       Window is transparent. -->
  <path fill="#e7dfd2" fill-rule="evenodd"
        d="M0 0 H400 V400 H0 Z M72 72 H328 V328 H72 Z"/>
  <!-- Rules: heavy ink, fine ink, ochre hairline -->
  <rect x="10" y="10" width="380" height="380" fill="none" stroke="#35302b" stroke-width="6"/>
  <rect x="78" y="78" width="244" height="244" fill="none" stroke="#35302b" stroke-width="5"/>
  <rect x="88" y="88" width="224" height="224" fill="none" stroke="#b98c3c" stroke-width="1.5"/>
  <!-- Corner diamonds (within the 72px corner slices) -->
  <g fill="#b98c3c">
    <path d="M40 22 L58 40 L40 58 L22 40 Z"/>
    <path d="M360 22 L378 40 L360 58 L342 40 Z"/>
    <path d="M40 342 L58 360 L40 378 L22 360 Z"/>
    <path d="M360 342 L378 360 L360 378 L342 360 Z"/>
  </g>
</svg>
